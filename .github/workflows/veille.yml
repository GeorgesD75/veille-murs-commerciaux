# La tournée : GitHub exécute ce fichier tout seul, c'est le « serveur
# gratuit » du projet. Elle collecte, filtre, score, régénère le site et envoie
# les emails s'il y a du nouveau, puis committe les données mises à jour.
name: Veille quotidienne

on:
  workflow_dispatch:
    inputs:
      collecter:
        description: 'Collecter les sources (désactiver pour republier le stock sans collecte ni emails)'
        type: boolean
        default: true
  schedule:
    # 3 tournées/jour (~07:17, 15:17, 23:17 à Paris l'été — cron en UTC) :
    # matin pour le café, après-midi pour les annonces de la journée, soir
    # pour ne rien rater la nuit. Minute creuse volontaire : les crons
    # « minute 0 » sont si demandés que GitHub les retarde de plusieurs
    # heures, voire les saute (constaté les 5 et 6 juillet 2026).
    - cron: "17 5,13,21 * * *"

permissions:
  contents: write          # nécessaire pour committer données + site
  pages: write             # demander explicitement le build après le push du bot

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  tournee:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Tests de santé (30 s)
        run: python -m pytest -q

      - name: Collecter les annonces
        id: collecte
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.collecter }}
        env:
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}  # optionnel : critique IA (pipeline/critique.py)
        run: python run.py

      - name: Régénérer le stock sans collecte ni notifications
        id: republication
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.collecter }}
        run: python -c "from scripts.regenerer_dashboard import main; main(persister=True)"

      - name: Sauvegarder la tournée avant publication
        if: ${{ !cancelled() && (steps.collecte.outcome == 'success' || steps.republication.outcome == 'success') }}
        uses: actions/upload-artifact@v4
        with:
          name: veille-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/
            docs/
          retention-days: 7
          if-no-files-found: error

      - name: Vérifier la syntaxe JS du dashboard généré
        # Filet de sécurité gratuit (Node déjà présent sur les runners GitHub) :
        # une erreur de syntaxe dans le JS embarqué casse TOUTE l'interactivité
        # du site (filtres, suivi, simulateur…) sans qu'aucun test Python ne
        # s'en rende compte — les tests ne vérifient que les données envoyées
        # au dashboard, jamais le script lui-même. Échoue avant de publier
        # plutôt que de découvrir un site cassé après coup.
        run: |
          python -c "import re, sys; html = open('docs/index.html', encoding='utf-8').read(); m = re.search(r'<script>(.*)</script>', html, re.S); m or sys.exit('Aucune balise <script> trouvée dans docs/index.html'); open('_dashboard_check.js', 'w', encoding='utf-8').write(m.group(1))"
          node --check _dashboard_check.js
          rm -f _dashboard_check.js

      - name: Vérifier que le header n'a pas explosé en hauteur
        # Deuxième filet, complémentaire au précédent : du JS syntaxiquement
        # valide peut quand même produire une mise en page cassée (déjà
        # arrivé — le header a un jour occupé la moitié de l'écran, cf.
        # scripts/verifier_apercu.py). Chrome est préinstallé sur les
        # runners GitHub ; si jamais il manquait, le script s'ignore
        # proprement plutôt que de bloquer la tournée pour un outil annexe.
        run: python scripts/verifier_apercu.py

      - name: Publier les données et le site
        run: |
          git config user.name "veille-bot"
          git config user.email "github-actions@users.noreply.github.com"
          python scripts/publier_veille.py

      - name: Déclencher la publication GitHub Pages
        # Un push avec GITHUB_TOKEN ne déclenche pas le build Pages automatique.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
